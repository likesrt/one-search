services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: one-search-app:latest
    container_name: one-search
    restart: unless-stopped

    # 全部环境变量从 .env 读取（默认值集中写在 .env.example，compose 里不再出现 ${VAR:-default}）
    env_file:
      - .env

    ports:
      - "${HOST_PORT}:80"

    volumes:
      # 数据库数据目录，容器重建不丢
      - ./data:/var/lib/postgresql/data

    # 容器内后端经 host.docker.internal 访问宿主机（抓取代理等场景）
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
